<a class="skip-link" href="#main-content">Skip to main content</a>
<header class="site-header">
  <nav class="site-nav" aria-label="Primary navigation">
    <a class="site-name" href="/" rel="home">Rui Marques<span aria-hidden="true">.</span></a>
    <ul>
      {{- $current := . -}}
      {{- range site.Menus.main }}
      <li>
        <a href="{{ .URL }}"{{ if or (eq $current.RelPermalink .URL) (and (eq .URL "/blog/") (eq $current.Section "blog")) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      </li>
      {{- end }}
    </ul>
  </nav>
</header>
