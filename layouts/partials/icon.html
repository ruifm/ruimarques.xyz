{{- $name := .name -}}
{{- if not (findRE `^[a-z0-9]+(?:-[a-z0-9]+)*$` $name) -}}
  {{- errorf "invalid icon name: %s" $name -}}
{{- end -}}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="/icons.svg#icon-{{ $name }}"></use></svg>
